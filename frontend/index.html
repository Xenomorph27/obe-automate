<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OBE Automate</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0f1b2d;--navy2:#162032;--navy3:#1e2d42;--navy4:#243452;--slate:#2d3f56;--amber:#f59e0b;--amber2:#fbbf24;--teal:#14b8a6;--red:#ef4444;--green:#22c55e;--purple:#8b5cf6;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--border:#1e3a5f;--card:#162032;--sidebar-w:240px}
html,body,#root{height:100%;font-family:'Inter',sans-serif;background:var(--navy);color:var(--text)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--navy2)}::-webkit-scrollbar-thumb{background:var(--slate);border-radius:3px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:1rem}
.auth-card{background:var(--navy2);border:1px solid var(--border);border-radius:16px;padding:2.5rem;width:100%;max-width:420px}
.auth-logo{font-family:'Fraunces',serif;font-size:1.8rem;color:var(--amber);margin-bottom:.25rem}
.auth-sub{color:var(--text2);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2rem}
.auth-role-btn{width:100%;padding:.9rem;border-radius:10px;border:1px solid var(--border);background:var(--navy3);color:var(--text);cursor:pointer;font-size:.95rem;margin-bottom:.75rem;transition:all .2s;display:flex;align-items:center;gap:.75rem}
.auth-role-btn:hover,.auth-role-btn.active{border-color:var(--amber);background:var(--navy4)}
.auth-input{width:100%;padding:.75rem 1rem;background:var(--navy3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;margin-bottom:.75rem;outline:none}
.auth-input:focus{border-color:var(--amber)}
.btn-amber{background:var(--amber);color:#000;border:none;padding:.75rem 1.5rem;border-radius:8px;font-weight:600;cursor:pointer;font-size:.95rem;transition:background .2s;width:100%}
.btn-amber:hover{background:var(--amber2)}.btn-amber:disabled{opacity:.5;cursor:not-allowed}
.auth-error{background:#3f1515;border:1px solid var(--red);border-radius:8px;padding:.75rem;color:#fca5a5;font-size:.85rem;margin-bottom:.75rem}
.app-shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--navy2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s;z-index:50}
.sidebar-logo{padding:1.25rem 1rem 1rem;border-bottom:1px solid var(--border)}
.logo-name{font-family:'Fraunces',serif;font-size:1.4rem;color:var(--amber);line-height:1}
.logo-sub{font-size:.65rem;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;margin-top:.2rem}
.sidebar-nav{flex:1;overflow-y:auto;padding:.75rem 0}
.nav-section{padding:.5rem 1rem .25rem;font-size:.65rem;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;cursor:pointer;color:var(--text2);font-size:.875rem;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:var(--navy3);color:var(--text)}.nav-item.active{background:var(--navy3);color:var(--amber);border-left-color:var(--amber)}
.nav-icon{width:18px;text-align:center;font-size:.95rem}
.course-pill{margin:.75rem 1rem;background:var(--navy4);border:1px solid var(--amber);border-radius:8px;padding:.5rem .75rem}
.course-pill-label{font-size:.65rem;color:var(--amber);text-transform:uppercase;letter-spacing:.08em}
.course-pill-name{font-size:.8rem;color:var(--text);margin-top:.1rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-footer{padding:.75rem 1rem;border-top:1px solid var(--border)}
.role-badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--navy3);border:1px solid var(--border);border-radius:20px;padding:.35rem .75rem;font-size:.75rem;color:var(--text2)}
.logout-btn{margin-top:.5rem;width:100%;padding:.5rem;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text3);cursor:pointer;font-size:.8rem;transition:all .2s}
.logout-btn:hover{border-color:var(--red);color:var(--red)}
.topbar{display:none;align-items:center;gap:.75rem;padding:.75rem 1rem;background:var(--navy2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.hamburger{background:none;border:none;color:var(--text);cursor:pointer;font-size:1.25rem;padding:.25rem}
.topbar-logo{font-family:'Fraunces',serif;font-size:1.1rem;color:var(--amber)}
.main-area{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.page-header{padding:1.5rem 1.75rem 1rem;border-bottom:1px solid var(--border)}
.page-title{font-size:1.1rem;font-weight:600;color:var(--text2)}
.page-body{padding:1.5rem 1.75rem;flex:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--navy3);border:1px solid var(--border);border-radius:10px;padding:1rem}
.stat-val{font-size:1.8rem;font-family:'Fraunces',serif;font-weight:700;color:var(--amber)}
.stat-label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-top:.25rem}
.btn{padding:.6rem 1.2rem;border-radius:8px;font-size:.875rem;font-weight:500;cursor:pointer;transition:all .2s;border:none}
.btn-primary{background:var(--amber);color:#000}.btn-primary:hover{background:var(--amber2)}.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}.btn-outline:hover{border-color:var(--text2);color:var(--text)}
.btn-ghost{background:transparent;border:none;color:var(--text2);padding:.4rem .75rem;cursor:pointer}.btn-ghost:hover{color:var(--text)}
.btn-teal{background:var(--teal);color:#fff;border:none}.btn-teal:hover{opacity:.85}
.btn-purple{background:var(--purple);color:#fff;border:none}.btn-purple:hover{opacity:.85}
.btn-danger{background:#3f1515;border:1px solid var(--red);color:#fca5a5;cursor:pointer}.btn-danger:hover{background:#5a1d1d}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:.35rem;font-weight:500}
.form-input{width:100%;padding:.65rem .9rem;background:var(--navy3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--amber)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead{background:var(--navy3)}
th{padding:.65rem 1rem;text-align:left;color:var(--text2);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
td{padding:.65rem 1rem;border-bottom:1px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:none}tr:hover td{background:var(--navy3)}
.badge{display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:20px;font-size:.7rem;font-weight:600}
.badge-green{background:#14401a;color:#86efac}.badge-red{background:#3f1515;color:#fca5a5}
.badge-amber{background:#3f2a00;color:#fcd34d}.badge-blue{background:#0c2340;color:#93c5fd}
.badge-purple{background:#2e1065;color:#c4b5fd}.badge-teal{background:#042f2e;color:#5eead4}
.alert{padding:.85rem 1rem;border-radius:8px;font-size:.875rem;margin-bottom:1rem;display:flex;align-items:flex-start;gap:.6rem}
.alert-error{background:#3f1515;border:1px solid var(--red);color:#fca5a5}
.alert-success{background:#14401a;border:1px solid var(--green);color:#86efac}
.alert-info{background:#0c2340;border:1px solid #3b82f6;color:#93c5fd}
.alert-warning{background:#3f2a00;border:1px solid var(--amber);color:#fcd34d}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,var(--navy3) 25%,var(--navy4) 50%,var(--navy3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px;height:1rem}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.tab{padding:.6rem 1.25rem;cursor:pointer;font-size:.875rem;color:var(--text2);border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:var(--text)}.tab.active{color:var(--amber);border-bottom-color:var(--amber)}
.heatmap-wrap{overflow-x:auto}
.heatmap-table{border-collapse:collapse;font-size:.8rem;white-space:nowrap}
.heatmap-table th,.heatmap-table td{padding:.5rem .75rem;border:1px solid var(--border);text-align:center}
.heatmap-table th{background:var(--navy3);color:var(--text2);font-weight:600}
.heatmap-table td.course-name{text-align:left;font-weight:500;min-width:140px}
.heat-high{background:#14401a;color:#86efac}.heat-med{background:#3f2a00;color:#fcd34d}.heat-low{background:#3f1515;color:#fca5a5}.heat-none{background:var(--navy3);color:var(--text3)}
.progress-bar{height:8px;background:var(--navy3);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .6s ease}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45}
.sidebar-overlay.show{display:block}
.question-card{background:var(--navy3);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:.75rem}
.question-card:hover{border-color:var(--slate)}
.bloom-badge-1{background:#1a1a3f;color:#a5b4fc}.bloom-badge-2{background:#0c2340;color:#93c5fd}
.bloom-badge-3{background:#042f2e;color:#5eead4}.bloom-badge-4{background:#2e1065;color:#c4b5fd}
.bloom-badge-5{background:#3f2a00;color:#fcd34d}.bloom-badge-6{background:#14401a;color:#86efac}
.error-boundary{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:1rem;text-align:center;padding:2rem}
.error-boundary h2{font-family:'Fraunces',serif;color:var(--red);font-size:1.5rem}
@media(max-width:768px){.topbar{display:flex}.sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.form-grid{grid-template-columns:1fr}.page-body{padding:1rem}.page-header{padding:1rem}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const API = '';

const USERS = {
  faculty:{ password:'faculty123', role:'faculty', label:'Faculty', icon:'👨‍🏫' },
  hod:    { password:'hod123',     role:'hod',     label:'HOD',     icon:'🎓' },
};

const BLOOM_LEVELS = [
  {level:1,label:'Remember',color:'bloom-badge-1'},
  {level:2,label:'Understand',color:'bloom-badge-2'},
  {level:3,label:'Apply',color:'bloom-badge-3'},
  {level:4,label:'Analyse',color:'bloom-badge-4'},
  {level:5,label:'Evaluate',color:'bloom-badge-5'},
  {level:6,label:'Create',color:'bloom-badge-6'},
];

const QTYPES = ['Short Answer','Long Answer','MCQ','Case Study'];

class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={hasError:false,error:null}}
  static getDerivedStateFromError(e){return{hasError:true,error:e}}
  render(){
    if(this.state.hasError)return(
      <div className="error-boundary">
        <h2>⚠ Something went wrong</h2>
        <p>{this.state.error?.message||'Unexpected error.'}</p>
        <button className="btn btn-outline" onClick={()=>this.setState({hasError:false})}>Try Again</button>
      </div>);
    return this.props.children;
  }
}

async function apiFetch(path,opts={}){
  const res=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opts});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.detail||`HTTP ${res.status}`)}
  return res.json();
}

function Alert({type='info',msg}){
  if(!msg)return null;
  const icons={error:'✗',success:'✓',warning:'⚠',info:'ℹ'};
  return <div className={`alert alert-${type}`}><span>{icons[type]}</span>{msg}</div>;
}
function Spinner(){return <span className="spinner"/>}
function Skeleton({rows=4}){return <div style={{display:'flex',flexDirection:'column',gap:'.75rem'}}>{Array.from({length:rows}).map((_,i)=><div key={i} className="skeleton" style={{width:`${60+Math.random()*35}%`}}/>)}</div>}
function AttainmentBar({pct}){const c=pct>=70?'#22c55e':pct>=50?'#f59e0b':'#ef4444';return <div style={{display:'flex',alignItems:'center',gap:'.5rem'}}><div className="progress-bar" style={{flex:1}}><div className="progress-fill" style={{width:`${pct}%`,background:c}}/></div><span style={{fontSize:'.75rem',color:'var(--text2)',minWidth:'38px'}}>{pct}%</span></div>}
function Badge({level}){const c=level==='High'?'badge-green':level==='Medium'?'badge-amber':'badge-red';return <span className={`badge ${c}`}>{level}</span>}
function BloomBadge({level,label}){const b=BLOOM_LEVELS.find(x=>x.level===level)||BLOOM_LEVELS[0];return <span className={`badge ${b.color}`}>L{level} {label||b.label}</span>}

// ── LOGIN ────────────────────────────────────────────────────────────────────
function LoginPage({onLogin}){
  const [role,setRole]=useState('faculty');
  const [username,setUsername]=useState('faculty');
  const [password,setPassword]=useState('');
  const [error,setError]=useState('');
  const [loading,setLoading]=useState(false);
  const handleLogin=()=>{
    setError('');
    if(!username||!password){setError('Enter username and password.');return;}
    setLoading(true);
    setTimeout(()=>{
      const u=USERS[role];
      if(username===role&&password===u.password){onLogin({username,role,label:u.label,icon:u.icon});}
      else{setError('Invalid credentials.');}
      setLoading(false);
    },500);
  };
  return(<div className="auth-wrap"><div className="auth-card">
    <div className="auth-logo">OBE.Auto</div>
    <div className="auth-sub">Accreditation Engine</div>
    {Object.entries(USERS).map(([k,u])=>(
      <button key={k} className={`auth-role-btn ${role===k?'active':''}`} onClick={()=>{setRole(k);setUsername(k);}}>
        <span style={{fontSize:'1.4rem'}}>{u.icon}</span>
        <div style={{textAlign:'left'}}><div style={{fontWeight:600}}>{u.label}</div><div style={{fontSize:'.75rem',color:'var(--text3)'}}>{k} / {u.password}</div></div>
      </button>))}
    {error&&<div className="auth-error">⚠ {error}</div>}
    <div className="form-group"><label className="form-label">Username</label><input className="auth-input" value={username} onChange={e=>setUsername(e.target.value)} placeholder="username"/></div>
    <div className="form-group"><label className="form-label">Password</label><input className="auth-input" type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()} placeholder="password"/></div>
    <button className="btn-amber" onClick={handleLogin} disabled={loading}>{loading?'Signing in…':'Sign In →'}</button>
  </div></div>);
}

// ── SIDEBAR ──────────────────────────────────────────────────────────────────
function Sidebar({page,setPage,activeCourse,user,onLogout,isOpen,onClose}){
  const nav=p=>{setPage(p);onClose();};
  const base=[
    {section:'MAIN'},{page:'home',icon:'🏠',label:'Home'},{page:'courses',icon:'📚',label:'Courses'},
    {section:'FACULTY FLOW'},
    {page:'syllabus',icon:'📄',label:'Upload Syllabus'},{page:'setup',icon:'⚙',label:'Course Setup'},
    {page:'sessions',icon:'📅',label:'Session Plan'},{page:'evaluation',icon:'📝',label:'Evaluation Plan'},
    {section:'ATTAINMENT'},
    {page:'marks',icon:'✏',label:'Upload Marks'},{page:'attainment',icon:'📊',label:'CO/PO Attainment'},{page:'reports',icon:'📑',label:'Reports'},
    {section:'QUESTIONS'},
    {page:'qgenerate',icon:'✨',label:'Generate Question'},{page:'qpaper',icon:'📋',label:'Question Paper'},
    {page:'qbank',icon:'🗄',label:'Question Bank'},{page:'qclassify',icon:'🔍',label:'Classify Question'},
    {page:'qmanipulate',icon:'🔄',label:'Manipulate Level'},
  ];
  const items=user?.role==='hod'?[{section:'HOD VIEW'},{page:'hod',icon:'🏛',label:'Dept Dashboard'},...base]:base;
  return(<div className={`sidebar ${isOpen?'open':''}`}>
    <div className="sidebar-logo"><div className="logo-name">OBE.Auto</div><div className="logo-sub">Accreditation Engine</div></div>
    {activeCourse&&<div className="course-pill"><div className="course-pill-label">Active Course</div><div className="course-pill-name">{activeCourse.course_code} — {activeCourse.course_name}</div></div>}
    <div className="sidebar-nav">
      {items.map((item,i)=>item.section
        ?<div key={i} className="nav-section">{item.section}</div>
        :<div key={i} onClick={()=>nav(item.page)} className={`nav-item ${page===item.page?'active':''}`}><span className="nav-icon">{item.icon}</span>{item.label}</div>)}
    </div>
    <div className="sidebar-footer">
      <a href="/docs" target="_blank" style={{display:'flex',alignItems:'center',gap:'.5rem',color:'var(--teal)',textDecoration:'none',fontSize:'.8rem',padding:'.4rem 0'}}>⚡ API Docs</a>
      <div className="role-badge"><span>{user?.icon}</span><span>{user?.label}</span></div>
      <button className="logout-btn" onClick={onLogout}>Sign Out</button>
    </div>
  </div>);
}

// ── HOME ─────────────────────────────────────────────────────────────────────
function HomePage({setPage}){
  const [courseCount,setCourseCount]=useState(0);
  useEffect(()=>{apiFetch('/courses/').then(d=>setCourseCount(d.length)).catch(()=>{})},[]);
  return(<div className="page-body">
    <div style={{marginBottom:'2rem'}}>
      <div style={{fontSize:'.8rem',color:'var(--amber)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:'.5rem'}}>OBE AUTOMATE — V0.1.0</div>
      <h1 style={{fontFamily:'Fraunces,serif',fontSize:'clamp(1.8rem,5vw,3rem)',lineHeight:1.1,marginBottom:'.5rem'}}>Outcome-Based<br/><span style={{color:'var(--amber)',fontStyle:'italic'}}>Education, Automated.</span></h1>
      <p style={{color:'var(--text2)',maxWidth:'520px',lineHeight:1.6,marginBottom:'1.5rem'}}>From syllabus PDF to NBA/NAAC reports — fully automated using AI.</p>
      <div style={{display:'flex',gap:'1rem',flexWrap:'wrap'}}>
        <button className="btn btn-primary" onClick={()=>setPage('syllabus')}>↗ Start New Course</button>
        <button className="btn btn-outline" onClick={()=>setPage('courses')}>View All Courses</button>
        <button className="btn btn-teal" style={{borderRadius:8}} onClick={()=>setPage('qgenerate')}>✨ Generate Question</button>
      </div>
    </div>
    <div className="stat-grid">
      {[{val:courseCount,label:'Courses',c:'var(--amber)'},{val:'AI',label:'Powered Plans',c:'var(--amber)'},{val:'NBA',label:'Format Reports',c:'var(--teal)'},{val:'5',label:'Question Tools',c:'var(--purple)'}].map((s,i)=>(
        <div key={i} className="stat-card"><div className="stat-val" style={{color:s.c}}>{s.val}</div><div className="stat-label">{s.label}</div></div>))}
    </div>
  </div>);
}

// ── COURSES ──────────────────────────────────────────────────────────────────
function CoursesPage({setActiveCourse,setPage}){
  const [courses,setCourses]=useState([]);const [loading,setLoading]=useState(true);const [error,setError]=useState('');
  useEffect(()=>{apiFetch('/courses/').then(d=>{setCourses(d);setLoading(false)}).catch(e=>{setError(e.message);setLoading(false)});},[]);
  return(<div className="page-body">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.25rem'}}>
      <h2 style={{fontFamily:'Fraunces,serif'}}>All Courses</h2>
      <button className="btn btn-primary" onClick={()=>setPage('syllabus')}>+ New Course</button>
    </div>
    <Alert type="error" msg={error}/>
    {loading?<Skeleton/>:courses.length===0?<Alert type="info" msg="No courses yet."/>:
    <div className="tbl-wrap"><table><thead><tr><th>Code</th><th>Course</th><th>Faculty</th><th>Semester</th><th>Action</th></tr></thead>
    <tbody>{courses.map(c=><tr key={c.id}><td><span className="badge badge-blue">{c.course_code}</span></td><td>{c.course_name}</td><td>{c.faculty_name}</td><td>{c.semester}</td>
    <td><button className="btn btn-outline" style={{fontSize:'.8rem',padding:'.3rem .7rem'}} onClick={()=>{setActiveCourse(c);setPage('attainment')}}>Select →</button></td></tr>)}</tbody></table></div>}
  </div>);
}

// ── SYLLABUS ─────────────────────────────────────────────────────────────────
function SyllabusPage(){
  const [file,setFile]=useState(null);const [loading,setLoading]=useState(false);const [result,setResult]=useState(null);const [error,setError]=useState('');
  const upload=async()=>{if(!file){setError('Select a PDF.');return;}setLoading(true);setError('');setResult(null);
    try{const fd=new FormData();fd.append('file',file);const res=await fetch(API+'/syllabus/upload',{method:'POST',body:fd});if(!res.ok)throw new Error((await res.json()).detail);setResult(await res.json());}
    catch(e){setError(e.message);}setLoading(false);};

            <div className="form-grid" style={{gap:'.5rem'}}>
              <div><label className="form-label">Type</label><select className="form-input form-select" style={{fontSize:'.8rem',padding:'.4rem'}} value={s.question_type} onChange={e=>updateSection(i,'question_type',e.target.value)}>{QTYPES.map(t=><option key={t}>{t}</option>)}</select></div>
              <div><label className="form-label">Count</label><input className="form-input" style={{fontSize:'.8rem',padding:'.4rem'}} type="number" value={s.count} onChange={e=>updateSection(i,'count',+e.target.value)}/></div>
              <div><label className="form-label">Marks each</label><input className="form-input" style={{fontSize:'.8rem',padding:'.4rem'}} type="number" value={s.marks_each} onChange={e=>updateSection(i,'marks_each',+e.target.value)}/></div>
              <div><label className="form-label">Total</label><div style={{padding:'.4rem',color:'var(--amber)',fontWeight:600}}>{s.count*s.marks_each}M</div></div>
            </div>
          </div>)}
        </div>
        <Alert type="error" msg={error}/>
        <button className="btn btn-primary" style={{width:'100%'}} onClick={generate} disabled={loading||!activeCourse}>{loading?<><Spinner/>Generating Paper…</>:'📋 Generate Full Paper'}</button>
        {result&&<div style={{display:'flex',gap:'.5rem',marginTop:'.75rem',flexWrap:'wrap'}}>
          <a href={`${API}/questions/paper/download/${activeCourse.id}/docx`} className="btn btn-outline" style={{textDecoration:'none',display:'inline-flex',alignItems:'center',flex:1,justifyContent:'center'}}>⬇ Word</a>
          <a href={`${API}/questions/paper/download/${activeCourse.id}/pdf`} className="btn btn-outline" style={{textDecoration:'none',display:'inline-flex',alignItems:'center',flex:1,justifyContent:'center'}}>⬇ PDF</a>
        </div>}
      </div>
      <div>
        {loading&&<div className="card" style={{display:'flex',alignItems:'center',justifyContent:'center',height:300}}><Spinner/><span style={{marginLeft:'.5rem',color:'var(--text2)'}}>AI is generating your paper…</span></div>}
        {result&&sectionGroups&&Object.entries(sectionGroups).map(([sec,qs])=>(
          <div key={sec} className="card" style={{marginBottom:'1rem'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'.75rem'}}>
              <h3 style={{fontFamily:'Fraunces,serif',fontSize:'1rem'}}>{sec}</h3>
              <span className="badge badge-amber">{qs.reduce((a,q)=>a+q.marks,0)}M</span>
            </div>
            {qs.map((q,i)=><div key={i} className="question-card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'.5rem'}}>
                <p style={{fontSize:'.875rem',lineHeight:1.6,flex:1}}><strong>Q{q.question_number}.</strong> {q.question_text}</p>
                <span className="badge badge-amber" style={{whiteSpace:'nowrap'}}>{q.marks}M</span>
              </div>
              {q.options&&<div style={{marginTop:'.5rem'}}>{q.options.map((o,j)=><div key={j} style={{fontSize:'.8rem',color:'var(--text2)',padding:'.15rem 0'}}>{o}</div>)}</div>}
              <div style={{display:'flex',gap:'.4rem',marginTop:'.5rem',flexWrap:'wrap'}}>
                <BloomBadge level={q.bloom_level} label={q.bloom_label}/>
                {q.co_id&&<span className="badge badge-blue">{q.co_id}</span>}
              </div>
            </div>)}
          </div>))}
        {!result&&!loading&&<div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:300,color:'var(--text3)',fontSize:'2.5rem'}}>📋<div style={{fontSize:'.9rem',marginTop:'.5rem'}}>Generated paper will appear here</div></div>}
      </div>
    </div>
  </div>);
}

// ── QUESTION BANK ─────────────────────────────────────────────────────────────
function QuestionBankPage({activeCourse,setPage}){
  const [questions,setQuestions]=useState([]);const [stats,setStats]=useState(null);const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');const [filters,setFilters]=useState({bloom_level:'',question_type:'',source:''});
  const load=async()=>{
    if(!activeCourse){setError('Select a course first.');return;}
    setLoading(true);setError('');
    try{const params=new URLSearchParams();
      if(filters.bloom_level)params.append('bloom_level',filters.bloom_level);
      if(filters.question_type)params.append('question_type',filters.question_type);
      if(filters.source)params.append('source',filters.source);
      const d=await apiFetch(`/questions/bank/${activeCourse.id}?${params}`);
      setQuestions(d.questions);setStats(d.stats);}
    catch(e){setError(e.message);}setLoading(false);
  };
  useEffect(()=>{if(activeCourse)load();},[activeCourse]);
  const deleteQ=async(id)=>{try{await apiFetch(`/questions/bank/${id}`,{method:'DELETE'});setQuestions(q=>q.filter(x=>x.id!==id));}catch(e){setError(e.message);}};
  const srcColors={generated:'badge-green',classified:'badge-blue',manipulated:'badge-purple',manual:'badge-amber'};
  return(<div className="page-body">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.25rem',flexWrap:'wrap',gap:'.75rem'}}>
      <h2 style={{fontFamily:'Fraunces,serif'}}>🗄 Question Bank</h2>
      <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap'}}>
        <button className="btn btn-outline" onClick={()=>setPage('qgenerate')} style={{fontSize:'.8rem'}}>+ Generate</button>
        <button className="btn btn-outline" onClick={()=>setPage('qclassify')} style={{fontSize:'.8rem'}}>+ Classify</button>
      </div>
    </div>
    {!activeCourse&&<Alert type="warning" msg="Select a course first."/>}
    {stats&&<div className="stat-grid" style={{marginBottom:'1.25rem'}}>
      {[{v:stats.total,l:'Total'},{v:Object.keys(stats.by_bloom).length,l:'Bloom Levels'},{v:Object.keys(stats.by_co).length,l:'COs Covered'},{v:Object.keys(stats.by_source).length,l:'Sources'}].map((s,i)=>
        <div key={i} className="stat-card"><div className="stat-val" style={{fontSize:'1.4rem'}}>{s.v}</div><div className="stat-label">{s.l}</div></div>)}
    </div>}
    {/* Filters */}
    <div className="card" style={{marginBottom:'1.25rem'}}>
      <div style={{display:'flex',gap:'.75rem',flexWrap:'wrap',alignItems:'flex-end'}}>
        <div><label className="form-label">Bloom Level</label>
          <select className="form-input form-select" style={{width:160}} value={filters.bloom_level} onChange={e=>setFilters(f=>({...f,bloom_level:e.target.value}))}>
            <option value="">All Levels</option>{BLOOM_LEVELS.map(b=><option key={b.level} value={b.level}>L{b.level} {b.label}</option>)}</select></div>
        <div><label className="form-label">Type</label>
          <select className="form-input form-select" style={{width:160}} value={filters.question_type} onChange={e=>setFilters(f=>({...f,question_type:e.target.value}))}>
            <option value="">All Types</option>{QTYPES.map(t=><option key={t}>{t}</option>)}</select></div>
        <div><label className="form-label">Source</label>
          <select className="form-input form-select" style={{width:160}} value={filters.source} onChange={e=>setFilters(f=>({...f,source:e.target.value}))}>
            <option value="">All Sources</option>{['generated','classified','manipulated','manual'].map(s=><option key={s}>{s}</option>)}</select></div>
        <button className="btn btn-primary" onClick={load} disabled={loading||!activeCourse}>{loading?<Spinner/>:'🔍 Filter'}</button>
      </div>
    </div>
    <Alert type="error" msg={error}/>
    {loading?<Skeleton rows={6}/>:questions.length===0?<Alert type="info" msg="No questions in bank yet. Generate or classify questions to add them."/>:
    <div>{questions.map(q=>(
      <div key={q.id} className="question-card" style={{position:'relative'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'.5rem'}}>
          <p style={{fontSize:'.9rem',lineHeight:1.6,flex:1}}>{q.question_text}</p>
          <button className="btn btn-danger" style={{fontSize:'.7rem',padding:'.3rem .6rem',whiteSpace:'nowrap'}} onClick={()=>deleteQ(q.id)}>Delete</button>
        </div>
        {q.options&&<div style={{marginTop:'.5rem'}}>{q.options.map((o,i)=><div key={i} style={{fontSize:'.8rem',color:'var(--text2)',padding:'.1rem 0'}}>{o}</div>)}</div>}
        <div style={{display:'flex',gap:'.4rem',marginTop:'.65rem',flexWrap:'wrap',alignItems:'center'}}>
          <BloomBadge level={q.bloom_level} label={q.bloom_label}/>
          {q.co_id&&<span className="badge badge-blue">{q.co_id}</span>}
          {q.po_id&&<span className="badge badge-teal">{q.po_id}</span>}
          <span className="badge badge-purple">{q.question_type}</span>
          <span className={`badge ${srcColors[q.source]||'badge-amber'}`}>{q.source}</span>
          <span className="badge badge-amber">{q.marks}M</span>
          {q.topic&&<span style={{fontSize:'.72rem',color:'var(--text3)'}}>📌 {q.topic}</span>}
          <span style={{fontSize:'.72rem',color:'var(--text3)',marginLeft:'auto'}}>#{q.id}</span>
        </div>
      </div>))}</div>}
  </div>);
}

// ── CLASSIFY QUESTION ─────────────────────────────────────────────────────────
function ClassifyQuestionPage({activeCourse}){
  const [questionText,setQuestionText]=useState('');const [loading,setLoading]=useState(false);
  const [error,setError]=useState('');const [result,setResult]=useState(null);const [saved,setSaved]=useState(false);
  const classify=async()=>{
    if(!activeCourse){setError('Select a course first.');return;}
    if(!questionText.trim()){setError('Enter a question to classify.');return;}
    setLoading(true);setError('');setResult(null);setSaved(false);
    try{const d=await apiFetch('/questions/classify',{method:'POST',body:JSON.stringify({
      course_id:activeCourse.id,course_name:activeCourse.course_name,
      question_text:questionText,cos:activeCourse.cos||[],pos:activeCourse.pos||[],save_to_bank:true})});setResult(d);}
    catch(e){setError(e.message);}setLoading(false);
  };
  return(<div className="page-body">
    <h2 style={{fontFamily:'Fraunces,serif',marginBottom:'1.25rem'}}>🔍 Classify Question</h2>
    <p style={{color:'var(--text2)',marginBottom:'1.5rem',fontSize:'.875rem'}}>Paste any question — AI will classify its Bloom's level, CO mapping, and PO mapping, then save it to the bank.</p>
    {!activeCourse&&<Alert type="warning" msg="Select a course first."/>}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1.5rem'}}>
      <div className="card">
        <div className="form-group"><label className="form-label">Question Text</label>
          <textarea className="form-input" rows={8} value={questionText} onChange={e=>setQuestionText(e.target.value)} placeholder="Paste or type any question here…&#10;&#10;e.g. Compare the time complexity of bubble sort and merge sort, and justify which is more suitable for large datasets."/></div>
        <Alert type="error" msg={error}/>
        <button className="btn btn-primary" onClick={classify} disabled={loading||!activeCourse}>{loading?<><Spinner/>Classifying…</>:'🔍 Classify & Save to Bank'}</button>
      </div>
      <div>
        {loading&&<div className="card" style={{display:'flex',alignItems:'center',justifyContent:'center',height:200}}><Spinner/><span style={{marginLeft:'.5rem',color:'var(--text2)'}}>AI is analysing your question…</span></div>}
        {result&&<div className="card">
          <div style={{display:'flex',alignItems:'center',gap:'.5rem',marginBottom:'1rem'}}>
            <h3 style={{fontSize:'1rem'}}>Classification Result</h3>
            {result.saved_id&&<span className="badge badge-green">✓ Saved (#{result.saved_id})</span>}
          </div>
          <div style={{background:'var(--navy3)',borderRadius:8,padding:'.75rem',marginBottom:'1rem',fontSize:'.875rem',lineHeight:1.6,color:'var(--text)'}}>{result.classification.question_text}</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'.75rem',marginBottom:'1rem'}}>
            {[['Bloom Level',<BloomBadge level={result.classification.bloom_level} label={result.classification.bloom_label}/>],
              ['Question Type',<span className="badge badge-purple">{result.classification.question_type}</span>],
              ['CO Mapping',result.classification.co_id?<span className="badge badge-blue">{result.classification.co_id}</span>:<span style={{color:'var(--text3)'}}>—</span>],
              ['PO Mapping',result.classification.po_id?<span className="badge badge-teal">{result.classification.po_id}</span>:<span style={{color:'var(--text3)'}}>—</span>]].map(([label,val],i)=>(
              <div key={i} style={{background:'var(--navy)',borderRadius:6,padding:'.65rem'}}>
                <div style={{fontSize:'.7rem',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'.35rem'}}>{label}</div>
                {val}
              </div>))}
          </div>
          {result.classification.reasoning&&<div style={{background:'var(--navy)',borderRadius:8,padding:'.75rem',borderLeft:'3px solid var(--amber)'}}>
            <div style={{fontSize:'.7rem',color:'var(--amber)',marginBottom:'.35rem',textTransform:'uppercase',letterSpacing:'.06em'}}>AI Reasoning</div>
            <p style={{fontSize:'.85rem',color:'var(--text2)',lineHeight:1.6}}>{result.classification.reasoning}</p>
          </div>}
        </div>}
        {!result&&!loading&&<div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:200,color:'var(--text3)',fontSize:'2.5rem'}}>🔍<div style={{fontSize:'.9rem',marginTop:'.5rem'}}>Classification will appear here</div></div>}
      </div>
    </div>
  </div>);
}

// ── MANIPULATE QUESTION ───────────────────────────────────────────────────────
function ManipulateQuestionPage({activeCourse}){
  const [form,setForm]=useState({original_question:'',original_bloom_level:1,target_bloom_level:3,topic:'',teacher_hint:''});
  const [loading,setLoading]=useState(false);const [error,setError]=useState('');const [result,setResult]=useState(null);
  const [selected,setSelected]=useState('suggested');const [saving,setSaving]=useState(false);const [saved,setSaved]=useState(null);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const manipulate=async()=>{
    if(!activeCourse){setError('Select a course first.');return;}
    if(!form.original_question.trim()){setError('Enter the original question.');return;}
    if(+form.original_bloom_level===+form.target_bloom_level){setError('Target level must be different from original.');return;}
    setLoading(true);setError('');setResult(null);setSaved(null);
    try{const d=await apiFetch('/questions/manipulate',{method:'POST',body:JSON.stringify({...form,original_bloom_level:+form.original_bloom_level,target_bloom_level:+form.target_bloom_level,course_id:activeCourse.id,course_name:activeCourse.course_name})});setResult(d);}
    catch(e){setError(e.message);}setLoading(false);
  };
  const saveToBank=async()=>{
    if(!result||!activeCourse)return;
    setSaving(true);
    const text=selected==='suggested'?result.suggested_rewrite:result.alternative_rewrite;
    try{const d=await apiFetch('/questions/manipulate/save',{method:'POST',body:JSON.stringify({
      course_id:activeCourse.id,question_text:text,topic:form.topic,
      bloom_level:result.target_bloom_level,question_type:'Short Answer',marks:5,source:'manipulated'})});setSaved(d.id);}
    catch(e){setError(e.message);}setSaving(false);
  };
  return(<div className="page-body">
    <h2 style={{fontFamily:'Fraunces,serif',marginBottom:'1.25rem'}}>🔄 Manipulate Bloom's Level</h2>
    <p style={{color:'var(--text2)',marginBottom:'1.5rem',fontSize:'.875rem'}}>Rewrite any question to a different Bloom's Taxonomy level. AI suggests rewrites; you choose and save.</p>
    {!activeCourse&&<Alert type="warning" msg="Select a course first."/>}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1.5rem'}}>
      <div className="card">
        <div className="form-group"><label className="form-label">Original Question</label>
          <textarea className="form-input" rows={6} value={form.original_question} onChange={e=>set('original_question',e.target.value)} placeholder="Paste the original question here…"/></div>
        <div className="form-grid">
          <div className="form-group"><label className="form-label">Current Bloom Level</label>
            <select className="form-input form-select" value={form.original_bloom_level} onChange={e=>set('original_bloom_level',e.target.value)}>
              {BLOOM_LEVELS.map(b=><option key={b.level} value={b.level}>L{b.level} — {b.label}</option>)}</select></div>
          <div className="form-group"><label className="form-label">Target Bloom Level</label>
            <select className="form-input form-select" value={form.target_bloom_level} onChange={e=>set('target_bloom_level',e.target.value)}>
              {BLOOM_LEVELS.map(b=><option key={b.level} value={b.level}>L{b.level} — {b.label}</option>)}</select></div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'.75rem',marginBottom:'1rem',padding:'.75rem',background:'var(--navy3)',borderRadius:8}}>
          <BloomBadge level={+form.original_bloom_level}/>
          <span style={{color:'var(--text3)'}}>→</span>
          <BloomBadge level={+form.target_bloom_level}/>
        </div>
        <div className="form-group"><label className="form-label">Topic (optional)</label><input className="form-input" value={form.topic} onChange={e=>set('topic',e.target.value)} placeholder="e.g. Sorting Algorithms"/></div>
        <div className="form-group"><label className="form-label">Teacher Hint (optional)</label><textarea className="form-input" rows={2} value={form.teacher_hint} onChange={e=>set('teacher_hint',e.target.value)} placeholder="e.g. Focus on real-world application, include a scenario…"/></div>
        <Alert type="error" msg={error}/>
        <button className="btn btn-primary" onClick={manipulate} disabled={loading||!activeCourse}>{loading?<><Spinner/>Rewriting…</>:'🔄 Rewrite Question'}</button>
      </div>
      <div>
        {loading&&<div className="card" style={{display:'flex',alignItems:'center',justifyContent:'center',height:300}}><Spinner/><span style={{marginLeft:'.5rem',color:'var(--text2)'}}>AI is rewriting your question…</span></div>}
        {result&&<div className="card">
          <h3 style={{fontSize:'1rem',marginBottom:'1rem'}}>Choose a Rewrite</h3>
          {[['suggested','✨ Suggested Rewrite',result.suggested_rewrite],['alternative','🔀 Alternative Rewrite',result.alternative_rewrite]].map(([key,label,text])=>(
            <div key={key} onClick={()=>setSelected(key)} style={{cursor:'pointer',background:selected===key?'var(--navy4)':'var(--navy3)',border:`1px solid ${selected===key?'var(--amber)':'var(--border)'}`,borderRadius:8,padding:'1rem',marginBottom:'.75rem',transition:'all .15s'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:'.5rem'}}>
                <span style={{fontSize:'.8rem',fontWeight:600,color:selected===key?'var(--amber)':'var(--text2)'}}>{label}</span>
                {selected===key&&<span style={{fontSize:'.75rem',color:'var(--amber)'}}>● Selected</span>}
              </div>
              <p style={{fontSize:'.875rem',lineHeight:1.6,color:'var(--text)'}}>{text}</p>
            </div>))}
          {result.explanation&&<div style={{background:'var(--navy)',borderRadius:8,padding:'.75rem',borderLeft:'3px solid var(--teal)',marginBottom:'1rem'}}>
            <div style={{fontSize:'.7rem',color:'var(--teal)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:'.35rem'}}>Why this works</div>
            <p style={{fontSize:'.85rem',color:'var(--text2)',lineHeight:1.6}}>{result.explanation}</p>
          </div>}
          {saved?<Alert type="success" msg={`Saved to Question Bank (ID: #${saved})`}/>:
          <button className="btn btn-teal" style={{width:'100%',padding:'.7rem',cursor:'pointer',borderRadius:8}} onClick={saveToBank} disabled={saving}>
            {saving?<><Spinner/>Saving…</>:'✓ Save Selected to Question Bank'}</button>}
        </div>}
        {!result&&!loading&&<div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:300,color:'var(--text3)',fontSize:'2.5rem'}}>🔄<div style={{fontSize:'.9rem',marginTop:'.5rem'}}>Rewritten question will appear here</div></div>}
      </div>
    </div>
  </div>);
}

// ── APP SHELL ─────────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]=useState(null);
  const [page,setPage]=useState('home');
  const [activeCourse,setActiveCourse]=useState(null);
  const [sidebarOpen,setSidebarOpen]=useState(false);
  if(!user)return <LoginPage onLogin={setUser}/>;
  const titles={home:'Dashboard — Overview',courses:'All Courses',syllabus:'Upload Syllabus',setup:'Course Setup',sessions:'Session Plan',evaluation:'Evaluation Plan',marks:'Upload Marks',attainment:'CO/PO Attainment',reports:'NBA/NAAC Reports',hod:'Department Dashboard',qgenerate:'Generate Question',qpaper:'Question Paper Generator',qbank:'Question Bank',qclassify:'Classify Question',qmanipulate:'Manipulate Bloom Level'};
  const pages={
    home:<HomePage setPage={setPage}/>,courses:<CoursesPage setActiveCourse={setActiveCourse} setPage={setPage}/>,
    syllabus:<SyllabusPage/>,setup:<CourseSetupPage setActiveCourse={setActiveCourse}/>,
    sessions:<SessionPlanPage activeCourse={activeCourse}/>,evaluation:<EvaluationPlanPage activeCourse={activeCourse}/>,
    marks:<MarksPage activeCourse={activeCourse}/>,attainment:<AttainmentPage activeCourse={activeCourse}/>,
    reports:<ReportsPage activeCourse={activeCourse}/>,hod:<HodDashboardPage/>,
    qgenerate:<GenerateQuestionPage activeCourse={activeCourse}/>,
    qpaper:<QuestionPaperPage activeCourse={activeCourse}/>,
    qbank:<QuestionBankPage activeCourse={activeCourse} setPage={setPage}/>,
    qclassify:<ClassifyQuestionPage activeCourse={activeCourse}/>,
    qmanipulate:<ManipulateQuestionPage activeCourse={activeCourse}/>,
  };
  return(<div className="app-shell">
    <div className={`sidebar-overlay ${sidebarOpen?'show':''}`} onClick={()=>setSidebarOpen(false)}/>
    <Sidebar page={page} setPage={setPage} activeCourse={activeCourse} user={user} onLogout={()=>{setUser(null);setPage('home');setActiveCourse(null);}} isOpen={sidebarOpen} onClose={()=>setSidebarOpen(false)}/>
    <div className="main-area">
      <div className="topbar">
        <button className="hamburger" onClick={()=>setSidebarOpen(o=>!o)}>☰</button>
        <span className="topbar-logo">OBE.Auto</span>
        {activeCourse&&<span style={{fontSize:'.75rem',color:'var(--amber)',marginLeft:'auto'}}>{activeCourse.course_code}</span>}
      </div>
      <div className="page-header"><div className="page-title">{titles[page]||page}</div></div>
      <ErrorBoundary key={page}>{pages[page]||<div className="page-body"><Alert type="error" msg="Page not found."/></div>}</ErrorBoundary>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
